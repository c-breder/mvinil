<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site Especial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pagina">

    <div class="faixa">
        <div class="faixa-texto">Um site especial para uma pessoa especial •</div>
    </div>

    <main class="conteudo">

        <div class="linha-principal">

            <section class="foto-area">
                <div class="foto">
                    <img src="imagens/foto.jpg" alt="" onerror="this.style.display='none'">
                    <span>coloque sua foto aqui</span>
                </div>
            </section>

            <section class="musica">
<div class="item-vinil" data-musica="musicas/musica.mp3">

                    <div class="toca-discos">
                        <div class="vinil" role="button" tabindex="0">
                            <div class="selo">
                                <strong>01</strong>
                                <i></i>
                            </div>
                        </div>

                        <div class="pino"></div>
                        <div class="braco">
                            <div class="agulha"></div>
                        </div>
                    </div>

                    <h3>Nome da música</h3>
                    <button id="botaoPlay">▶ TOCAR</button>
                </div>

                <audio id="audio" preload="metadata"></audio>
            </section>

        </div>

    </main>

    <footer>
        feito com carinho &lt;3
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
